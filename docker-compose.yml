name: qa-automation-portfolio

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    # Published for manual browsing only; the test runner reaches the app over the internal network.
    ports:
      - '${JUICE_SHOP_PORT:-3000}:3000'
    networks:
      - qa-net
    # The image is distroless (no curl/wget), so the healthcheck uses its bundled Node runtime.
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://localhost:3000/rest/admin/application-version').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      juice-shop:
        condition: service_healthy
    environment:
      # Set BASE_URL in .env (see .env.example) or as a GitHub Actions secret; never hardcoded here.
      BASE_URL: ${BASE_URL:-}
      CI: ${CI:-}
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    networks:
      - qa-net

networks:
  qa-net:
    driver: bridge
